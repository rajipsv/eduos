<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2d6a4f">
  <title>You're offline · Tutorsala</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a1814;
      background: #f4f1eb;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e8e2d8;
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(26, 24, 20, 0.06), 0 8px 24px rgba(26, 24, 20, 0.06);
    }
    .logo { width: 64px; height: 64px; object-fit: contain; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; color: #2d6a4f; }
    p { margin: 0 0 24px; color: #6b6560; }
    button {
      display: inline-block;
      width: 100%;
      max-width: 240px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #2d6a4f;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover, button:focus-visible { background: #1b4332; }
    button:focus-visible { outline: 3px solid #d8f3dc; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #141311; color: #f4f1eb; }
      .card { background: #1f1d1a; border-color: #34302b; }
      h1 { color: #74c69d; }
      p { color: #b5afa8; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/img/tutorsala-logo.webp" alt="Tutorsala" width="64" height="64">
    <h1>You're offline</h1>
    <p>Tutorsala needs an internet connection to load your center's data. Check your connection and try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  </script>
</body>
</html>
